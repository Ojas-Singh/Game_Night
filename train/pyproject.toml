[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamelab-train"
version = "0.1.0"
description = "One player for every Game Night game: model, self-play training and evaluation"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "gamelab"]

[tool.setuptools]
packages = ["gamelab_train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
