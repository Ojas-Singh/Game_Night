[workspace]
resolver = "2"
members = ["gamelab", "gamelab-cli", "gamelab-py", "gamelab-wasm"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
