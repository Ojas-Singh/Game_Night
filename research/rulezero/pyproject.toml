[project]
name = "rulezero"
version = "0.1.0"
description = "RuleZero research stack: OpenSpiel-first general strategic intelligence"
requires-python = ">=3.10"
dependencies = ["open_spiel>=2.0", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rulezero*"]
