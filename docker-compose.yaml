services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ROOM_TTL_MINUTES: ${ROOM_TTL_MINUTES:-360}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      RULEZERO_COMPILER_PROVIDER: ${RULEZERO_COMPILER_PROVIDER:-}
      RULEZERO_COMPILER_URL: ${RULEZERO_COMPILER_URL:-}
      RULEZERO_COMPILER_MODEL: ${RULEZERO_COMPILER_MODEL:-}
      RULEZERO_COMPILER_API_KEY: ${RULEZERO_COMPILER_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_GO_MODEL: ${OPENCODE_GO_MODEL:-mimo-v2.5}
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-}
      AGENT_API_URL: ${AGENT_API_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      # Voice/video relay (see the coturn service below and docs/DEPLOY.md).
      ICE_SERVERS: ${ICE_SERVERS:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      # The "Laya" Cabo AI persona (services/laya); without it Laya seats play as the Balanced bot.
      LAYA_URL: ${LAYA_URL:-http://laya:8000}
      LAYA_TIMEOUT_MS: ${LAYA_TIMEOUT_MS:-8000}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # Laya decision service for the "Laya" Cabo persona (CPU; model Ojas-Singh/laya-cabo from Hugging Face,
  # downloaded once into the laya-hf volume, about 0.8 GB). The app falls back to the Balanced bot when it is
  # down or slow.
  laya:
    build: ./services/laya
    environment:
      LAYA_MODEL: ${LAYA_MODEL:-Ojas-Singh/laya-cabo}
      LAYA_THREADS: ${LAYA_THREADS:-4}
    volumes:
      - laya-hf:/data/hf
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 3G

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  # Automatic-HTTPS reverse proxy for public deployments. getUserMedia
  # (voice/webcam) and Stripe webhooks require TLS. Start with:
  #   docker compose --profile proxy up -d
  # Set DOMAIN (and ACME_EMAIL for Let's Encrypt registration). Keep port 3000
  # firewalled off when the proxy fronts the app.
  caddy:
    image: caddy:2-alpine
    profiles: ['proxy']
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

  # Optional self-hosted, cookieless analytics (the build wires VITE_UMAMI_SRC
  # to its /script.js and VITE_UMAMI_WEBSITE_ID to the site id). Start with:
  #   docker compose --profile analytics up -d
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    profiles: ['analytics']
    ports:
      - '${UMAMI_PORT:-3001}:3000'
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami-change-me}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-change-me-umami-app-secret}
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped

  umami-db:
    image: postgres:16-alpine
    profiles: ['analytics']
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami-change-me}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional TURN relay for voice/video. Players on mobile data or strict
  # NATs cannot connect peer-to-peer without one. Start with:
  #   docker compose --profile turn up -d
  # Set TURN_SECRET (same value for app and coturn), TURN_REALM (your domain)
  # and on the app TURN_URLS=turn:<host>:3478,turn:<host>:3478?transport=tcp.
  # Open 3478/udp+tcp and 49160-49200/udp on the host firewall.
  coturn:
    image: coturn/coturn:4.6
    profiles: ['turn']
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-change-me-turn}
      - --realm=${TURN_REALM:-gamenight}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
    restart: unless-stopped

volumes:
  redis-data:
  laya-hf:
  caddy-data:
  caddy-config:
  umami-db-data:
