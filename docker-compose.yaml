services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ROOM_TTL_MINUTES: ${ROOM_TTL_MINUTES:-360}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      RULEZERO_COMPILER_PROVIDER: ${RULEZERO_COMPILER_PROVIDER:-}
      RULEZERO_COMPILER_URL: ${RULEZERO_COMPILER_URL:-}
      RULEZERO_COMPILER_MODEL: ${RULEZERO_COMPILER_MODEL:-}
      RULEZERO_COMPILER_API_KEY: ${RULEZERO_COMPILER_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_GO_MODEL: ${OPENCODE_GO_MODEL:-mimo-v2.5}
      # Cosmetics shop (Stripe activates when key + origin are set).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-}
      AGENT_API_URL: ${AGENT_API_URL:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  # Automatic-HTTPS reverse proxy for public deployments. getUserMedia
  # (voice/webcam) and Stripe webhooks require TLS. Start with:
  #   docker compose --profile proxy up -d
  # Set DOMAIN (and ACME_EMAIL for Let's Encrypt registration). Keep port 3000
  # firewalled off when the proxy fronts the app.
  caddy:
    image: caddy:2-alpine
    profiles: ['proxy']
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

  # Optional self-hosted, cookieless analytics (the build wires VITE_UMAMI_SRC
  # to its /script.js and VITE_UMAMI_WEBSITE_ID to the site id). Start with:
  #   docker compose --profile analytics up -d
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    profiles: ['analytics']
    ports:
      - '${UMAMI_PORT:-3001}:3000'
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami-change-me}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-change-me-umami-app-secret}
    depends_on:
      umami-db:
        condition: service_healthy
    restart: unless-stopped

  umami-db:
    image: postgres:16-alpine
    profiles: ['analytics']
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami-change-me}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  caddy-data:
  caddy-config:
  umami-db-data:
